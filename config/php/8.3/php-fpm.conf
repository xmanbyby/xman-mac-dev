[global]
pid = /Users/xman/DevEnvironment/run/php/php83-fpm.pid
error_log = /Users/xman/DevEnvironment/logs/php/8.3/php-fpm-error.log
daemonize = no
log_level = notice
emergency_restart_threshold = 10
emergency_restart_interval = 1m
process_control_timeout = 10s

[www]
user = xman
group = staff
listen = /Users/xman/DevEnvironment/run/php/php83.sock
listen.mode = 0660
listen.allowed_clients = 127.0.0.1
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
request_terminate_timeout = 300s
request_slowlog_timeout = 10s
slowlog = /Users/xman/DevEnvironment/logs/php/8.3/php-fpm-slow.log
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
php_admin_value[error_log] = /Users/xman/DevEnvironment/logs/php/8.3/php-error.log
php_admin_flag[log_errors] = on
