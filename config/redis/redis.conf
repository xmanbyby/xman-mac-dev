# Managed by dev - 由管理器生成
bind 127.0.0.1
protected-mode yes
port 6380
tcp-backlog 511
timeout 0
tcp-keepalive 300

daemonize no
supervised no
pidfile /Users/xman/DevEnvironment/run/redis/redis.pid
loglevel notice
logfile /Users/xman/DevEnvironment/logs/redis/redis.log
databases 16

always-show-logo no
set-proc-title yes
proc-title-template "{title} {listen-addr}"

save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /Users/xman/DevEnvironment/data/redis/data

appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

maxmemory 512mb
maxmemory-policy allkeys-lru
requirepass abc.1234
