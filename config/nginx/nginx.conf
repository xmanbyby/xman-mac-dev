# Managed by dev - 由管理器生成，请勿手工修改（修改请用 dev config / dev project）
worker_processes auto;
worker_rlimit_nofile 4096;
pid /Users/xman/DevEnvironment/run/nginx/nginx.pid;

error_log /Users/xman/DevEnvironment/logs/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    default_type application/octet-stream;
    charset utf-8;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /Users/xman/DevEnvironment/logs/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 100m;
    client_body_temp_path /Users/xman/DevEnvironment/run/nginx/client_body_temp;
    proxy_temp_path /Users/xman/DevEnvironment/run/nginx/proxy_temp;
    fastcgi_temp_path /Users/xman/DevEnvironment/run/nginx/fastcgi_temp;
    uwsgi_temp_path /Users/xman/DevEnvironment/run/nginx/uwsgi_temp;
    scgi_temp_path /Users/xman/DevEnvironment/run/nginx/scgi_temp;

    include /opt/homebrew/etc/nginx/mime.types;
    include /Users/xman/DevEnvironment/config/nginx/projects/*.conf;
}
