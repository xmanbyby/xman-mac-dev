# Managed by dev - project erp (laravel, PHP 8.3)
server {
    listen 8080;
    server_name erp.cc;
    root /Users/xman/Projects/wwwroot/erp.cc/public;
    index index.php index.html;
    charset utf-8;
    client_max_body_size 100m;

    access_log /Users/xman/DevEnvironment/logs/nginx/erp.access.log;
    error_log /Users/xman/DevEnvironment/logs/nginx/erp.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/Users/xman/DevEnvironment/run/php/php83.sock;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include /opt/homebrew/etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
