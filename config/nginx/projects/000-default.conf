# Managed by dev - 默认页面
server {
    listen 8080;
    server_name localhost 127.0.0.1;
    root /Users/xman/DevEnvironment/run/nginx/www;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}
